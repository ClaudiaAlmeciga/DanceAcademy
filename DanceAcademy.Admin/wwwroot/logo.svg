<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Doble nota musical -->
  <g fill="white" opacity="0.95">
    <!-- Cabeza nota 1 -->
    <ellipse cx="15.5" cy="31.5" rx="4.8" ry="3.2" transform="rotate(-18 15.5 31.5)"/>
    <!-- Tallo nota 1 -->
    <rect x="19.6" y="13" width="2" height="19" rx="1"/>
    <!-- Cabeza nota 2 -->
    <ellipse cx="28" cy="34.5" rx="4.8" ry="3.2" transform="rotate(-18 28 34.5)"/>
    <!-- Tallo nota 2 -->
    <rect x="32.1" y="16" width="2" height="19" rx="1"/>
    <!-- Barra que une los tallos -->
    <rect x="19.6" y="13" width="14.5" height="3" rx="1.5"/>
  </g>
</svg>
