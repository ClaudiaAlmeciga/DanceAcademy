services:
  postgres:
    image: postgres:16
    container_name: danceacademy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: danceacademy
    ports:
      - "55432:5432"
    volumes:
      - danceacademy_pgdata:/var/lib/postgresql/data

volumes:
  danceacademy_pgdata:
