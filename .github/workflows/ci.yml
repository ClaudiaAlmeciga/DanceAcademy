name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DanceAcademy.sln

      - name: Build
        run: dotnet build DanceAcademy.sln --no-restore -c Release

      - name: Test
        run: dotnet test DanceAcademy.Tests/DanceAcademy.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DanceAcademy.Tests/TestResults/test-results.trx
